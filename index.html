<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#a9e2ff" />
<title>Chicken Cross — a Three.js Crossy Road</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a9e2ff'/%3E%3Crect x='9' y='13' width='14' height='11' fill='%23fff'/%3E%3Crect x='12' y='7' width='9' height='8' fill='%23fff'/%3E%3Crect x='15' y='4' width='3' height='4' fill='%23e23c3c'/%3E%3Crect x='7' y='10' width='4' height='3' fill='%23ffa62b'/%3E%3Crect x='13' y='9' width='2' height='2' fill='%231b232a'/%3E%3C/svg%3E" />

<!-- three.js r184 via importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js"
  }
}
</script>

<style>
  :root{
    --ink:#20303c;
    --card:#ffffff;
    --accent:#ff5a4d;
    --gold:#ffc93c;
    --shadow: 0 18px 44px -14px rgba(15,40,60,.5), 0 6px 14px -6px rgba(15,40,60,.3);
    --font: 'Trebuchet MS', 'Avenir Next', system-ui, -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:#a9e2ff; }
  body{
    font-family:var(--font);
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  canvas{ display:block; }

  #hud{
    position:fixed; inset:0; pointer-events:none;
    padding: max(14px, env(safe-area-inset-top)) 16px 16px;
    display:flex; flex-direction:column;
  }
  .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }

  #score{
    font-size: clamp(44px, 9vw, 78px);
    font-weight: 900; line-height:.9;
    color:#fff;
    text-shadow:
      0 4px 0 rgba(12,38,55,.5),
      0 0 14px rgba(12,38,55,.35),
      -2px 0 0 rgba(12,38,55,.35), 2px 0 0 rgba(12,38,55,.35),
      0 -2px 0 rgba(12,38,55,.35);
    letter-spacing:-.02em;
  }
  #best{
    margin-top:6px; font-size:14px; font-weight:800; letter-spacing:.14em;
    text-transform:uppercase; color:#fff;
    text-shadow: 0 2px 0 rgba(12,38,55,.5), 0 0 10px rgba(12,38,55,.5);
  }
  .pill{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.9); border-radius:999px;
    padding:8px 14px 8px 10px; box-shadow:var(--shadow);
    font-weight:900; font-size:18px;
  }
  .coin-dot{
    width:20px; height:20px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe479, var(--gold) 60%, #e0a21a);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
  }
  #sound{
    pointer-events:auto; cursor:pointer; border:0; font:inherit;
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,.9); box-shadow:var(--shadow);
    font-size:20px; line-height:1; display:grid; place-items:center;
  }
  #sound:active{ transform:scale(.94); }
  .right{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; display:grid; place-items:center;
    padding:24px; pointer-events:auto;
    background:rgba(12,35,52,.42); backdrop-filter:blur(3px);
    opacity:0; visibility:hidden; transition:opacity .28s ease, visibility .28s;
  }
  .overlay.show{ opacity:1; visibility:visible; }
  .card{
    width:min(420px, 92vw); background:var(--card); border-radius:26px;
    box-shadow:var(--shadow); padding:30px 28px 26px; text-align:center;
    transform:translateY(14px) scale(.97); transition:transform .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .overlay.show .card{ transform:none; }
  .card h1{
    font-size:clamp(30px,6.4vw,42px); line-height:1; letter-spacing:-.02em;
    margin-bottom:10px; font-weight:900;
  }
  .card h1 span{ color:var(--accent); }
  .card p{ font-size:15px; line-height:1.5; opacity:.72; font-weight:600; }
  .stats{ display:flex; gap:12px; margin:22px 0 20px; }
  .stat{
    flex:1; background:#f2f6f9; border-radius:16px; padding:14px 8px;
  }
  .stat b{ display:block; font-size:32px; line-height:1; }
  .stat small{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.55; }
  .stat.gold b{ color:#d99a06; }
  .btn{
    display:block; width:100%; border:0; cursor:pointer; font:inherit;
    background:var(--accent); color:#fff; font-weight:900; font-size:19px;
    padding:16px; border-radius:16px; letter-spacing:.02em;
    box-shadow:0 6px 0 #d63f34; transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #d63f34; }
  .keys{
    margin-top:18px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap;
    font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; opacity:.5;
  }
  kbd{
    display:inline-block; background:#eef3f7; border-radius:6px; padding:3px 7px;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.08); font-family:inherit; font-size:11px;
  }
  #deathReason{ font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:.1em; font-size:12px; }
  .new-best{
    display:inline-block; margin-top:12px; background:var(--gold); color:#5a4100;
    font-weight:900; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    padding:6px 12px; border-radius:999px;
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="hud">
  <div class="top">
    <div>
      <div id="score">0</div>
      <div id="best">Best 0</div>
    </div>
    <div class="right">
      <button id="sound" title="Sound on/off">🔊</button>
      <div class="pill"><span class="coin-dot"></span><span id="coins">0</span></div>
    </div>
  </div>
</div>

<div class="overlay show" id="startScreen">
  <div class="card">
    <h1>Chicken <span>Cross</span></h1>
    <p>Hop across roads, rivers and railways. Don't get squashed, don't get wet, and don't let the eagle catch you.</p>
    <div class="keys">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows</span>
      <span>swipe or tap on mobile</span>
    </div>
    <button class="btn" id="playBtn" style="margin-top:22px">Play</button>
  </div>
</div>

<div class="overlay" id="gameOver">
  <div class="card">
    <div id="deathReason">Squashed</div>
    <h1 style="margin-top:8px">Game Over</h1>
    <div class="stats">
      <div class="stat"><b id="finalScore">0</b><small>Score</small></div>
      <div class="stat gold"><b id="finalCoins">0</b><small>Coins</small></div>
      <div class="stat"><b id="finalBest">0</b><small>Best</small></div>
    </div>
    <div id="newBest" class="new-best hidden">New personal best!</div>
    <button class="btn" id="retryBtn" style="margin-top:18px">Play Again</button>
    <div class="keys" style="margin-top:14px"><span>press <kbd>space</kbd> to retry</span></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
